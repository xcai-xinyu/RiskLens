name: risklens-demo
services:
  api:
    build: .
    image: risklens:pre-v1-local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PYTHON_DOTENV_DISABLED: "1"
      RISKLENS_DB_PATH: /app/data/private/risklens.sqlite
    volumes:
      - report_history:/app/data/private
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
  ui:
    image: risklens:pre-v1-local
    command: ["python", "-m", "streamlit", "run", "frontend/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--browser.gatherUsageStats", "false"]
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      PYTHON_DOTENV_DISABLED: "1"
      RISKLENS_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
volumes:
  report_history:
